name: fingertip-frenzy
services:
  app:
    image: fingertip-frenzy:latest
    pull_policy: never
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
    mem_limit: 2g
    stop_grace_period: 30s
    logging:
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 256m
    logging:
      options: {max-size: "10m", max-file: "3"}

volumes:
  caddy_data:
  caddy_config:
