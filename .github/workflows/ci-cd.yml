name: Test, build and deploy EC2
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          MONGOMS_VERSION: 7.0.24
      - name: Check deployment scripts
        run: |
          bash -n deploy/deploy.sh
          sudo bash deploy/test-deploy.sh
          python3 -m py_compile deploy/send-command.py
          python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Validate Compose and Caddy
        env:
          DOMAIN: games.example.com
          ACME_EMAIL: test@example.com
          APP_IMAGE: ghcr.io/example/fingertip-frenzy@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          sudo mkdir -p /opt/fingertip-frenzy
          sudo cp deploy/.env.example /opt/fingertip-frenzy/.env
          docker compose -f deploy/compose.yaml config --quiet
          docker run --rm -e DOMAIN -e ACME_EMAIL -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image name
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test packaged frontend and API
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
        run: |
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --publish 127.0.0.1:5000:5000 "$IMAGE"
          trap 'docker logs smoke; docker rm -f smoke' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 1 http://127.0.0.1:5000/api/health/live
          curl --fail http://127.0.0.1:5000/login | grep 'id="root"'
          curl --fail -I http://127.0.0.1:5000/game-assets/memory/index.html | grep -i 'Content-Security-Policy:.*wasm-unsafe-eval'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/missing.js)" = 404
      - name: Publish tested image
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.name.outputs.image }}:${{ github.sha }}
        run: |
          docker push "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "image=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Deployment image reference
        id: reference
        env:
          REFERENCE: ${{ steps.publish.outputs.image }}
        run: echo "image=$REFERENCE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: frenzy-${{ github.run_id }}
      - name: Deploy immutable image using Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          APP_IMAGE: ${{ needs.image.outputs.reference }}
        run: python3 deploy/send-command.py
