name: Test and deploy EC2
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
        env:
          MONGOMS_VERSION: 7.0.24

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the frontend and backend image
        run: |
          docker build --label "org.opencontainers.image.revision=$GITHUB_SHA" -t fingertip-frenzy:latest .
          docker save fingertip-frenzy:latest | gzip > app.tar.gz
      - name: Copy to EC2 and start the app
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          EC2_USER: ${{ vars.EC2_USER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/ec2-key"
          hosts="$RUNNER_TEMP/ec2-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > "$key"
          printf '%s\n' "$EC2_KNOWN_HOSTS" | tr -d '\r' > "$hosts"
          chmod 600 "$key" "$hosts"
          user="${EC2_USER:-ubuntu}"
          options=(-i "$key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$hosts" -o ConnectTimeout=15 -o ServerAliveInterval=15)
          upload="/tmp/frenzy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${options[@]}" "$user@$EC2_HOST" "mkdir -p '$upload'"
          scp "${options[@]}" app.tar.gz deploy/compose.yaml deploy/Caddyfile "$user@$EC2_HOST:$upload/"
          ssh "${options[@]}" "$user@$EC2_HOST" "sudo -n bash -s -- '$upload' '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          upload="$1"
          revision="$2"
          trap 'rm -f "$upload/app.tar.gz" "$upload/compose.yaml" "$upload/Caddyfile"; rmdir "$upload" || true' EXIT
          cd /opt/fingertip-frenzy
          if [ ! -f .env ]; then
            echo 'Missing /opt/fingertip-frenzy/.env. Create it with DOMAIN, ACME_EMAIL and MONGODB_URI before deploying.' >&2
            exit 1
          fi
          cp "$upload/compose.yaml" "$upload/Caddyfile" .
          if ! docker compose --env-file /opt/fingertip-frenzy/.env config --quiet; then
            echo 'Check /opt/fingertip-frenzy/.env on EC2: DOMAIN must be your hostname (without https://), and ACME_EMAIL must be your email. GitHub Secrets and backend/.env do not supply these values.' >&2
            exit 1
          fi
          docker load -i "$upload/app.tar.gz"
          docker compose --env-file /opt/fingertip-frenzy/.env run --rm --no-deps app node scripts/check-database.mjs
          docker compose --env-file /opt/fingertip-frenzy/.env run --rm --no-deps app node scripts/indexes.mjs
          docker compose --env-file /opt/fingertip-frenzy/.env up -d --force-recreate --wait --wait-timeout 180
          container="$(docker compose --env-file /opt/fingertip-frenzy/.env ps -q app)"
          running_image="$(docker inspect --format '{{.Image}}' "$container")"
          running_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$running_image")"
          if [ "$running_revision" != "$revision" ]; then
            echo 'The running app does not match the requested commit.' >&2
            exit 1
          fi
          echo "Running app commit: $running_revision"
          docker compose --env-file /opt/fingertip-frenzy/.env exec -T app node scripts/publish-detective-cases.mjs
          docker compose --env-file /opt/fingertip-frenzy/.env ps
          REMOTE
